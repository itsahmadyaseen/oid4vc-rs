[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/crypto",
    "crates/issuer",
    "crates/verifier",
    "crates/status",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/itsahmadyaseen/oid4vc-rs"
authors = ["Ahmad Yaseen"]

[workspace.dependencies]
# Async runtime & HTTP
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography
p256 = { version = "0.13", features = ["ecdsa", "jwk", "pem"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
sha2 = "0.10"
rand = "0.8"

# JOSE
base64ct = { version = "1", features = ["alloc"] }

# X.509 certificates for the x5c chain HAIP requires
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

# CBOR and COSE (for mdoc, ISO/IEC 18013-5)
ciborium = "0.2"
coset = "0.3"

# X.509 parsing, for mdoc x5chain validation
x509-cert = "0.2"
sha1 = "0.10"
time = "0.3"

# Status list compression
flate2 = "1"

# Identifiers & time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
dotenvy = "0.15"

# URL encoding
urlencoding = "2"

# Internal crates
oid4vc-types = { path = "crates/types" }
oid4vc-crypto = { path = "crates/crypto" }
oid4vc-issuer = { path = "crates/issuer" }
oid4vc-verifier = { path = "crates/verifier" }
oid4vc-status = { path = "crates/status" }
